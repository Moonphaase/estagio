{% extends "frontend/base.html" %}

{% block title %}Editar Dataset{% endblock %}
{% block page_title %}Editar {{ dataset.name|default:"Dataset" }}{% endblock %}
{% block nav_datasets %}bg-gray-100 font-medium text-gray-900{% endblock %}

{% block content %}

<div class="bg-white rounded-lg border border-gray-200 max-w-2xl p-6">
    <form method="POST">
        {% csrf_token %}

        <div class="mb-4">
            <label class="block text-xs text-gray-500 mb-1">Nome</label>
            <input type="text" name="name" value="{{ dataset.name }}" class="w-full text-sm border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-400">
        </div>

        <div class="mb-4">
            <label class="block text-xs text-gray-500 mb-1">Descrição</label>
            <textarea name="description" rows="3" class="w-full text-sm border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-400">{{ dataset.description }}</textarea>
        </div>

        <div class="mb-4">
            <label class="block text-xs text-gray-500 mb-1">Categoria</label>
            <select name="category" class="w-full text-sm border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-400">
                <option value="">Seleciona uma categoria</option>
                {% for category in categories %}
                    <option value="{{ category.id }}" {% if dataset.category and dataset.category.id == category.id %}selected{% endif %}>{{ category.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-4">
            <label class="block text-xs text-gray-500 mb-1">Visibilidade</label>
            <select name="visibility" class="w-full text-sm border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-400">
                <option value="public" {% if dataset.visibility == 'public' %}selected{% endif %}>Público</option>
                <option value="private" {% if dataset.visibility == 'private' %}selected{% endif %}>Privado</option>
                <option value="internal" {% if dataset.visibility == 'internal' %}selected{% endif %}>Interno</option>
            </select>
        </div>

        <div class="mb-6">
            <label class="block text-xs text-gray-500 mb-1">Estado</label>
            <select name="status" class="w-full text-sm border border-gray-200 rounded px-3 py-2 focus:outline-none focus:border-blue-400">
                <option value="draft" {% if dataset.status == 'draft' %}selected{% endif %}>Rascunho</option>
                <option value="published" {% if dataset.status == 'published' %}selected{% endif %}>Publicado</option>
                <option value="archived" {% if dataset.status == 'archived' %}selected{% endif %}>Arquivado</option>
            </select>
        </div>

        <div class="flex gap-2">
            <button type="submit" class="bg-blue-600 text-white text-sm px-4 py-2 rounded hover:bg-blue-700">
                Guardar
            </button>
            <a href="/datasets/{{ dataset.id }}" class="text-sm text-gray-500 px-4 py-2 rounded border border-gray-200 hover:bg-gray-50">
                Cancelar
            </a>
        </div>
    </form>
</div>

{% endblock %}
