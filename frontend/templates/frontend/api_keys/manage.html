{% extends 'frontend/base.html' %}
{% block content %}
<div class="container mx-auto p-8 max-w-2xl">
    <h1 class="text-2xl font-bold mb-6">Gestão de API Keys</h1>
    <div class="bg-white p-6 rounded shadow mb-8">
        <h2 class="text-lg font-semibold mb-4">Gerar nova chave</h2>
        <div class="flex gap-2">
            <input type="text" id="keyName" placeholder="Nome da chave" class="border p-2 flex-grow rounded">
            <button onclick="gerarChave()" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Gerar</button>
        </div>
    </div>
    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-lg font-semibold mb-4">As tuas chaves</h2>
        <div id="listaChaves" class="space-y-2"></div>
    </div>
</div>

<script>
window.onload = carregarChaves;

async function carregarChaves() {
    const res = await fetch('/api/auth/api-keys/');
    const chaves = await res.json();
    const lista = document.getElementById('listaChaves');
    
    lista.innerHTML = chaves.map(k => `
        <div class="flex justify-between items-center border-b p-2">
            <span>${k.name} (<code>${k.key_full}</code>)</span>
            <button onclick="apagarChave(${k.id})" class="text-red-500">Apagar</button>
        </div>
    `).join('');
}

async function gerarChave() {
    const name = document.getElementById('keyName').value;
    await fetch('/api/auth/api-keys/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{ csrf_token }}'},
        body: JSON.stringify({ name: name || 'Nova Chave' })
    });
    carregarChaves();
}

async function apagarChave(id) {
    await fetch(`/api/auth/api-keys/${id}/`, {
        method: 'DELETE',
        headers: {'X-CSRFToken': '{{ csrf_token }}'}
    });
    carregarChaves();
}
</script>
{% endblock %}
