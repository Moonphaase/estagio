{% extends 'frontend/base.html' %}
{% block content %}
<div class="container mx-auto p-8">
    <h1 class="text-2xl font-bold">Gestão de API Keys</h1>
    <p>O sistema está a ser configurado.</p>
    <button onclick="testarApi()" class="bg-blue-500 text-white p-2 rounded mt-4">Testar Ligação</button>
</div>

<script>
async function testarApi() {
    const res = await fetch('/api/auth/api-keys/', { method: 'POST', headers: {'X-CSRFToken': '{{ csrf_token }}'} });
    const data = await res.json();
    alert(data.message);
}
</script>
{% endblock %}
