{% extends 'frontend/base.html' %}
{% block content %}
<!-- Contentor de notificações fixo no canto superior direito -->
<div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2"></div>

<div class="container mx-auto p-8 max-w-2xl">
    <h1 class="text-2xl font-bold mb-6">Gestão de API Keys</h1>

    <div class="bg-white p-6 rounded shadow mb-8">
        <h2 class="text-lg font-semibold mb-4">Gerar nova chave</h2>
        <form id="formChave" class="flex flex-col gap-3">
            <input type="text" id="keyName" placeholder="Nome da chave" class="border p-2 rounded" required>
            <div class="flex gap-2">
                <!-- min e max definidos para restringir a entrada -->
                <input type="date" id="expiryDate" class="border p-2 flex-grow rounded" required min="2026-07-06" max="2100-12-31">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
                    Gerar
                </button>
            </div>
        </form>
    </div>

    <div class="bg-white p-6 rounded shadow">
        <h2 class="text-lg font-semibold mb-4">As tuas chaves</h2>
        <div id="listaChaves" class="space-y-2">
            <p class="text-gray-500">A carregar...</p>
        </div>
    </div>
</div>

<script>
window.onload = carregarChaves;

function getCsrfToken() {
    return '{{ csrf_token }}';
}

function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    const toast = document.createElement('div');
    toast.className = `p-4 rounded shadow-lg text-white ${type === 'success' ? 'bg-slate-900' : 'bg-red-600'}`;
    toast.innerHTML = `
        <div class="flex items-center gap-2">
            <span class="font-bold">${type === 'success' ? '● Sucesso' : '● Erro'}</span>
        </div>
        <p class="text-sm mt-1">${message}</p>
    `;
    container.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}

// Função para formatar data de AAAA-MM-DD para DD/MM/AAAA
function formatarData(dataISO) {
    if (!dataISO) return 'N/A';
    const [ano, mes, dia] = dataISO.split('T')[0].split('-');
    return `${dia}/${mes}/${ano}`;
}

document.getElementById('formChave').addEventListener('submit', async function(e) {
    e.preventDefault(); 
    const nome = document.getElementById('keyName').value;
    const data = document.getElementById('expiryDate').value;

    try {
        const response = await fetch('/api/auth/api-keys/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCsrfToken() },
            body: JSON.stringify({ name: nome, expires_at: data })
        });

        if (response.ok) {
            const data = await response.json();
            showToast("Chave gerada! Copia-a agora — não será mostrada novamente.");
            alert(`A tua nova API Key:\n\n${data.key}\n\nUsa no Swagger: Token ${data.key}`);
            document.getElementById('formChave').reset();
            carregarChaves();
        } else {
            const errorData = await response.json();
            showToast(errorData.error || "Ocorreu um problema.", "error");
        }
    } catch (err) {
        showToast("Erro de conexão.", "error");
    }
});

async function carregarChaves() {
    try {
        const res = await fetch('/api/auth/api-keys/');
        const chaves = await res.json();
        const lista = document.getElementById('listaChaves');
        
        if (chaves.length === 0) {
            lista.innerHTML = '<p class="text-gray-500">Não tens chaves geradas.</p>';
            return;
        }

        lista.innerHTML = chaves.map(k => {
            const hoje = new Date().toISOString().split('T')[0];
            const dataExp = k.expires_at ? k.expires_at.split('T')[0] : null;
            
            // Alterado de "<=" para "<" para que o dia de hoje seja considerado "Ativa"
            const expirada = dataExp ? dataExp < hoje : false;
            
            const estado = expirada ? 'Expirada' : 'Ativa';
            const cor = expirada ? 'text-red-600' : 'text-green-600';

            return `
                <div class="flex justify-between items-center border-b p-2">
                    <div>
                        <span class="font-bold">${k.name}</span><br>
                        <code class="text-sm">${k.key_prefix}****</code><br>
                        <small class="text-gray-500">
                            Expira em: ${formatarData(k.expires_at)} | 
                            <span class="${cor}">${estado}</span>
                        </small>
                    </div>
                    <button onclick="apagarChave(${k.id})" class="text-red-500 font-semibold ml-4">Apagar</button>
                </div>
            `;
        }).join('');
    } catch (e) {
        document.getElementById('listaChaves').innerHTML = '<p class="text-red-500">Erro ao carregar chaves.</p>';
    }
}

async function apagarChave(id) {
    if (!confirm('Tens a certeza que queres eliminar esta chave?')) return;
    try {
        await fetch(`/api/auth/api-keys/${id}/`, {
            method: 'DELETE',
            headers: {'X-CSRFToken': getCsrfToken()}
        });
        showToast("Chave eliminada.");
        carregarChaves();
    } catch (err) {
        showToast("Erro ao apagar chave.", "error");
    }
}
</script>
{% endblock %}
